name: Preview · GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: sage-auto-pages
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout prototype
        uses: actions/checkout@v4
      - name: Verify JavaScript syntax
        run: |
          node --check app.js
          node --check company-detail.js
          node --check external-portals.js
          node --check gap-closure.js
          node --check premium-experience.js
          node --check reference-experience.js
          node --check motion-studio.js
      - name: Run interactive mock workflow smoke tests
        run: |
          node tests/smoke.test.js
          node tests/company-workflows.test.js
          node tests/company-edge-cases.test.js
          node tests/external-portals.test.js
          node tests/p3d-quality.test.js
          node tests/p3d2-gap-closure.test.js
          node tests/p3e-experience.test.js
          node tests/reference-experience.test.js
          node tests/motion-studio.test.js
      - name: Verify frontend assets exist
        run: |
          test -s index.html
          test -s styles.css
          test -s app.js
          test -s company-detail.js
          test -s company-detail.css
          test -s external-portals.js
          test -s external-portals.css
          test -s gap-closure.js
          test -s gap-closure.css
          test -s premium-experience.js
          test -s premium-experience.css
          test -s reference-experience.js
          test -s reference-experience.css
          test -s motion-studio.js
          test -s motion-studio.css
          grep -q 'app.js' index.html
          grep -q 'styles.css' index.html
  deploy:
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site
        run: |
          mkdir -p _site
          cp index.html app.js styles.css company-detail.js company-detail.css external-portals.js external-portals.css gap-closure.js gap-closure.css reference-experience.js reference-experience.css premium-experience.js premium-experience.css motion-studio.js motion-studio.css _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

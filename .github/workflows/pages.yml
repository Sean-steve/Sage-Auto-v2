name: Preview · GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: sage-auto-pages
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout prototype
        uses: actions/checkout@v4
      - name: Verify JavaScript syntax
        run: node --check app.js
      - name: Run interactive mock workflow smoke tests
        run: node tests/smoke.test.js
      - name: Verify frontend assets exist
        run: |
          test -s index.html
          test -s styles.css
          test -s app.js
          grep -q 'app.js' index.html
          grep -q 'styles.css' index.html
  deploy:
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site
        run: |
          mkdir -p _site
          cp index.html app.js styles.css _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

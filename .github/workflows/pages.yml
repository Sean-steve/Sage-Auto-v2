name: Preview · GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: sage-auto-pages
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout prototype
        uses: actions/checkout@v4
      - name: Verify JavaScript syntax
        run: |
          node --check app.js
          node --check company-detail.js
          node --check external-portals.js
          node --check gap-closure.js
          node --check premium-experience.js
          node --check reference-experience.js
          node --check motion-studio.js
          node --check ops-hardening.js
          node --check rental-core.js
          node --check rental-journey.js
          node --check onboarding-continuity.js
          node --check experience-foundation.js
      - name: Run interactive mock workflow smoke tests
        run: |
          node tests/smoke.test.js
          node tests/company-workflows.test.js
          node tests/company-edge-cases.test.js
          node tests/external-portals.test.js
          node tests/p3d-quality.test.js
          node tests/p3d2-gap-closure.test.js
          node tests/p3e-experience.test.js
          node tests/reference-experience.test.js
          node tests/motion-studio.test.js
          node tests/p3f-operations.test.js
          node tests/rental-core.test.js
          node tests/rental-journey.test.js
          node tests/audit-onboarding.test.js
          node tests/audit-wave1.test.js
      - name: Verify frontend assets exist
        run: |
          test -s index.html
          test -s styles.css
          test -s app.js
          test -s company-detail.js
          test -s company-detail.css
          test -s external-portals.js
          test -s external-portals.css
          test -s gap-closure.js
          test -s gap-closure.css
          test -s premium-experience.js
          test -s premium-experience.css
          test -s reference-experience.js
          test -s reference-experience.css
          test -s motion-studio.js
          test -s motion-studio.css
          test -s ops-hardening.js
          test -s ops-hardening.css
          test -s rental-core.js
          test -s rental-journey.js
          test -s rental-journey.css
          test -s onboarding-continuity.js
          test -s experience-foundation.js
          test -s experience-foundation.css
          grep -q 'app.js' index.html
          grep -q 'styles.css' index.html
  deploy:
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site
        run: |
          mkdir -p _site
          # Include every root-level frontend JavaScript/CSS asset referenced by index.html.
          cp index.html ./*.js ./*.css _site/
          # Abort deployment if any local script/stylesheet reference is missing.
          grep -oE '(src|href)="[.]/[^"]+' index.html | cut -d'"' -f2 | sed 's#^[.]/##' | while IFS= read -r asset; do
            test -s "_site/$asset" || { echo "Missing deployed asset: $asset"; exit 1; }
          done
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

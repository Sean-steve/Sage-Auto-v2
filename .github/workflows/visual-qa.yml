name: Phase 3-D.2 Visual QA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-visual-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout prototype
        uses: actions/checkout@v4
      - name: Node setup
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser testing dependency
        run: npm install --no-save --no-package-lock playwright
      - name: Install Chromium for browser automation
        run: npx playwright install --with-deps chromium
      - name: Start static frontend
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/sage-auto-static.log 2>&1 &
          for i in $(seq 1 25); do
            if curl --silent --fail http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/sage-auto-static.log
          exit 1
      - name: Screenshot and responsive overflow audit
        run: node tests/visual-audit.mjs
      - name: Upload screenshot / QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sage-auto-p3d2-visual-audit
          path: artifacts/visual-audit/
          retention-days: 21
